name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ensure M2 repository directory exists
        run: mkdir -p ~/.m2/repository

      - name: Run unit tests
        run: mvn -B test

      - name: Run integration tests
        run: mvn -B failsafe:integration-test failsafe:verify