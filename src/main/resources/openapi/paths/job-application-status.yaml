patch:
  description: Update the status of a job application
  tags:
    - applications
  operationId: updateStatus
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/ApplicationStatusUpdateDto.yaml'
  responses:
    '200':
      description: Status updated
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApplicationDto.yaml'