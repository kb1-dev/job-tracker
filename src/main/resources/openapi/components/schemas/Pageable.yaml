type: object
properties:
  page:
    type: integer
    minimum: 0
    default: 0
    description: Zero-based page index
  size:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    description: Number of items per page
  sort:
    type: array
    items:
      type: string
    description: Sorting criteria in the format "property,(asc|desc)"